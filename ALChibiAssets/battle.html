<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>战斗素材库 · 碧蓝航线</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="battle.css"></head><body>
<header><div><div class="eyebrow">AZUR LANE · LOCAL COLLECTION</div><h1>战斗素材库</h1><p>炮弹、飞机和鱼雷 · 透明贴图与原始特效资料</p></div><a class="local-badge" href="index.html">角色小人素材库</a></header>
<main class="layout"><aside><h2>素材分类</h2><nav id="categories"></nav></aside><section class="collection"><div class="toolbar"><label class="search"><span>搜索</span><input id="search" type="search" placeholder="中文名称、型号或素材名称"></label><label class="kind"><span>范围</span><select id="scope"><option value="visible">有图片的素材</option><option value="all">包含纯特效资料</option><option value="prefab">战斗预制体</option></select></label></div><div class="collection-heading"><h2 id="heading"></h2><p id="count"></p></div><div id="grid" class="grid"></div><div id="pagination"></div><p id="empty" hidden>没有符合条件的素材。</p></section></main>
<dialog id="detail"><div class="detail-head"><div><div id="category" class="eyebrow"></div><h2 id="name"></h2><p id="model"></p></div><button id="close" class="close" aria-label="关闭预览">✕</button></div><div class="battle-body"><section><div id="picture" class="stage checker"><img id="main-image" alt=""></div><div class="player-controls"><label>背景<select id="background"><option value="checker">透明棋盘</option><option value="dark">深色</option><option value="light">浅色</option></select></label><label>缩放<input id="zoom" type="range" min="25" max="200" value="100"></label></div><p id="image-info"></p></section><section class="battle-info"><h3>素材中的图片</h3><div id="images"></div><p id="status"></p><p id="native-info"></p><p id="aliases"></p></section></div></dialog>
<script src="battle-library.js"></script><script src="vendor/pixi.min.js"></script><script src="vendor/pixi-spine.js"></script><script src="battle.js"></script><script src="battle-player.js"></script></body></html>
