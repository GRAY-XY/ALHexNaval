<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>碧蓝航线 · 小人素材库</title><link rel="stylesheet" href="app.css"></head>
<body>
<header><div><div class="eyebrow">AZUR LANE · LOCAL COLLECTION</div><h1>小人素材库</h1><p>按阵营找到角色，再挑选皮肤和动作。</p></div><a class="local-badge" href="battle.html">炮弹 · 飞机 · 鱼雷</a></header>
<main class="layout"><aside><h2>阵营</h2><nav id="factions" aria-label="阵营筛选"></nav></aside><section class="collection"><div class="toolbar"><label class="search"><span>搜索</span><input id="search" type="search" placeholder="角色、皮肤名称或素材名称" autocomplete="off"></label><label class="kind"><span>范围</span><select id="kind"><option value="all">全部角色与素材</option><option value="character">已识别角色</option><option value="other">其他素材</option></select></label></div><div class="collection-heading"><h2 id="heading">全部阵营</h2><p id="count"></p></div><div id="grid" class="grid"></div><div id="pagination"></div><p id="empty" hidden>没有符合条件的角色，试试其他阵营或关键词。</p></section></main>
<dialog id="detail" aria-labelledby="role-name"><div class="detail-head"><div><span id="role-faction" class="eyebrow"></span><h2 id="role-name"></h2><p id="role-count"></p></div><button id="close" class="close" aria-label="关闭角色">✕</button></div><div class="detail-body"><section class="skin-panel"><h3>皮肤与素材</h3><div id="skins"></div></section><section class="player-panel"><div class="player-heading"><div><h3 id="skin-name"></h3><p id="skin-description"></p></div></div><div id="stage" class="stage checker"><div id="player-status" role="status">选择皮肤后即可查看动作</div></div><div class="player-controls"><label>动作<select id="animation" disabled></select></label><button id="pause" disabled>暂停</button><label>速度<select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><label>背景<select id="background"><option value="checker">透明棋盘</option><option value="dark">深色</option><option value="light">浅色</option></select></label></div><div class="secondary-controls"><label>缩放<input id="zoom" type="range" min="50" max="180" value="100"></label><button id="reset">重置视图</button><a id="folder" href="#" target="_blank" rel="noopener">查看该皮肤的独立素材</a></div><p id="action-info" class="action-info">动作在此页面直接播放。</p></section></div></dialog>
<script src="library.js"></script><script src="vendor/pixi.min.js"></script><script src="vendor/pixi-spine.js"></script><script src="app.js"></script>
</body></html>
