name: Deploy AL HEX NAVAL

on:
  push:
    branches: [main]
    paths:
      - ALHexGame/**
      - .gitattributes
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out game source
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          sparse-checkout: |
            .gitattributes
            ALHexGame
          sparse-checkout-cone-mode: false

      - name: Download game assets
        run: git lfs pull --include="ALHexGame/**" --exclude=""

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ALHexGame/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ALHexGame

      - name: Build game
        run: npm run build
        working-directory: ALHexGame

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ALHexGame/dist

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
